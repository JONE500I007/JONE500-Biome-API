# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
# The Minecraft part of the mod version (the jar works on every 26.1.x, so it stays "26.1").
minecraft_version_name=26.1
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
# The full version is <mod_version>+<minecraft_version_name>, e.g. 1.0.0+26.1 (put together in build.gradle).
#   Jar:   build/libs/jone500-biome-api-0.1.0+26.1.jar
#   Maven: maven.modrinth:jone500-biome-api:0.1.0+26.1
# 0.x = beta: the API may still change.
mod_version=1.0.0
group=net.biome.api
archives_base_name=jone500-biome-api

# Dependencies
fabric_api_version=0.155.3+26.1.2
