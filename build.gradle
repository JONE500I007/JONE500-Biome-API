plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Version = mod version + Minecraft version, e.g. 0.1.0+26.1, so the builds for different
// Minecraft versions never share a version number (on Modrinth or in the jar name).
version = "${project.mod_version}+${project.minecraft_version_name}"

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric Loader and Fabric API automatically.
	// Modrinth: other mods for the compatibility tests (see "compat" below). Dev only.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

// ---------------------------------------------------------------------------
// "testmod" source set: an example mod that USES the Biome API, plus the automated tests.
// It is only for the dev environment and is NOT included in the published jar.
// ---------------------------------------------------------------------------
sourceSets {
	testmod {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
		resources.srcDir 'src/testmod/generated'
	}
}

loom {
	mods {
		"jone500-biome-api" {
			sourceSet sourceSets.main
		}
		"biome_test" {
			sourceSet sourceSets.testmod
		}
	}

	runs {
		// Minecraft with the Biome API + the example biomes from the testmod.
		testmodClient {
			client()
			configName = "Testmod Client"
			source sourceSets.testmod
			runDir "run"
		}
		testmodServer {
			server()
			configName = "Testmod Server"
			source sourceSets.testmod
			runDir "run/server"
		}
		// Automated test on a real dedicated server: samples biomes over a large area.
		gameTest {
			server()
			configName = "Server Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/run/gameTest/junit.xml")}"
			source sourceSets.testmod
			runDir "build/run/gameTest"
		}
		// Automated in-game test in a real singleplayer world: finds red plains and takes a screenshot.
		clientGameTest {
			client()
			configName = "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			source sourceSets.testmod
			runDir "build/run/clientGameTest"
		}
		// Runs data generation for the testmod.
		datagen {
			client()
			configName = "Data Generation (testmod)"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/testmod/generated")}"
			vmArg "-Dfabric-api.datagen.modid=biome_test"
			source sourceSets.testmod
			runDir "build/datagen"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is required by the Biome API.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processTestmodResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Publishes a -sources.jar next to the main jar so modders can read the API code in their IDE.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

// ---------------------------------------------------------------------------
// Compatibility tests with other mods (dev only, never in the published jar).
// Run with a group name, for example:
//   gradlew runClientGameTest -Pcompat=apis
//   gradlew runClientGameTest -Pcompat=all
// The testmod then also registers a biome through TerraBlender and through Biolith (when they are
// loaded), and BiomeCompatClientGameTest checks that everything works together.
// ---------------------------------------------------------------------------
// Modrinth version IDs (not version numbers) where one number has files for several loaders.
def compatMods = [
	// Minecraft 26.3 versions (Modrinth version ids where one version number has files for several loaders)
	terrablender : "maven.modrinth:terrablender:xirJYe1V",          // 26.3.0.0.9
	biolith      : "maven.modrinth:biolith:F5nTRwpV",               // 3.8.0-beta.2
	bop          : "maven.modrinth:biomes-o-plenty:sbAVJ5Mn",       // 26.3.0.0.16
	glitchcore   : "maven.modrinth:glitchcore:kfFeDnrp",            // 26.3.0.0.5, required by Biomes O' Plenty
	terralith    : "maven.modrinth:terralith:aGE3hYAA",             // 2.6.5+26.3
	lithostitched: "maven.modrinth:lithostitched:pZgI6b2t",         // 2.0.6-fabric-26.3
	tectonic     : "maven.modrinth:tectonic:rKBGygwM",              // 3.1.0+beta2-fabric-26.3
	c2me         : "maven.modrinth:c2me-fabric:Qfm2hhas",           // 0.4.2-alpha.0.121+26.3
	lithium      : "maven.modrinth:lithium:Lal8mJGR",               // mc26.3-0.26.4-fabric
	sodium       : "maven.modrinth:sodium:v7Lw0h1m",                // mc26.3-0.9.3-beta.5-fabric
	ferritecore  : "maven.modrinth:ferrite-core:d5ddUdiB",          // 9.0.0-fabric
	chunky       : "maven.modrinth:chunky:86FKD9qx",                // 1.5.66
	dh           : "maven.modrinth:distanthorizons:TGgEbP9A",       // 3.3.4-26.3
	// Regions Unexplored has no 26.3 version yet (tested on the 26.1 branch).
]
def compatGroups = [
	apis     : ["terrablender", "biolith"],
	bop      : ["terrablender", "glitchcore", "bop"],
	terralith: ["terralith", "lithostitched"],
	tectonic : ["tectonic", "lithostitched"],
	perf     : ["c2me", "lithium", "sodium", "ferritecore"],
	chunky   : ["chunky"],
	dh       : ["dh"],
]
compatGroups.all = compatMods.keySet() as List

def compat = (findProperty("compat") ?: "").toString().split(",")*.trim().findAll { it }
def compatSelected = compat.collectMany { name ->
	if (!compatGroups.containsKey(name) && !compatMods.containsKey(name)) {
		throw new GradleException("Unknown compat group '${name}'. Use one of: ${compatGroups.keySet() + compatMods.keySet()}")
	}
	compatGroups[name] ?: [name]
}.unique()

dependencies {
	// The testmod uses the TerraBlender and Biolith APIs (only when those mods are loaded).
	testmodCompileOnly compatMods.terrablender
	testmodCompileOnly compatMods.biolith
	compatSelected.each { testmodRuntimeOnly compatMods[it] }
}

loom.runs.configureEach {
	if (!compat.isEmpty()) {
		vmArg "-Dbiome_test.compat=${compat.join(',')}"
	}
}
