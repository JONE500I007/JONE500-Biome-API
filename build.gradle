plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Version = mod version + Minecraft version, e.g. 0.1.0+26.1, so the builds for different
// Minecraft versions never share a version number (on Modrinth or in the jar name).
version = "${project.mod_version}+${project.minecraft_version_name}"

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric Loader and Fabric API automatically.
	// Modrinth: other mods for the compatibility tests (see "compat" below). Dev only.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

// ---------------------------------------------------------------------------
// "tutorial" source set: a tutorial mod that shows how to USE the Biome API
// (start with src/tutorial/java/net/biome/tutorial/TutorialMod.java), plus the automated tests
// in its "test" package. It is only for the dev environment and is NOT included in the published jar.
// ---------------------------------------------------------------------------
sourceSets {
	tutorial {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
		resources.srcDir 'src/tutorial/generated'
	}
}

loom {
	mods {
		"jone500-biome-api" {
			sourceSet sourceSets.main
		}
		"biome_tutorial" {
			sourceSet sourceSets.tutorial
		}
	}

	runs {
		// Minecraft with the Biome API + the example biomes from the tutorial.
		tutorialClient {
			client()
			configName = "Tutorial Client"
			source sourceSets.tutorial
			runDir "run"
		}
		tutorialServer {
			server()
			configName = "Tutorial Server"
			source sourceSets.tutorial
			runDir "run/server"
		}
		// Automated test on a real dedicated server: samples biomes over a large area.
		gameTest {
			server()
			configName = "Server Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/run/gameTest/junit.xml")}"
			source sourceSets.tutorial
			runDir "build/run/gameTest"
		}
		// Automated in-game test in a real singleplayer world: finds red plains and takes a screenshot.
		clientGameTest {
			client()
			configName = "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			source sourceSets.tutorial
			runDir "build/run/clientGameTest"
		}
		// Runs data generation for the tutorial.
		datagen {
			client()
			configName = "Data Generation (tutorial)"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/tutorial/generated")}"
			vmArg "-Dfabric-api.datagen.modid=biome_tutorial"
			source sourceSets.tutorial
			runDir "build/datagen"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is required by the Biome API.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processTutorialResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Publishes a -sources.jar next to the main jar so modders can read the API code in their IDE.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

// ---------------------------------------------------------------------------
// Compatibility tests with other mods (dev only, never in the published jar).
// Run with a group name, for example:
//   gradlew runClientGameTest -Pcompat=apis
//   gradlew runClientGameTest -Pcompat=all
// The tutorial's tests then also register a biome through TerraBlender and through Biolith (when
// they are loaded), and BiomeCompatClientGameTest checks that everything works together.
// ---------------------------------------------------------------------------
// Modrinth version IDs (not version numbers) where one number has files for several loaders.
def compatMods = [
	// Minecraft 26.2 versions (Modrinth version ids where one version number has files for several loaders)
	terrablender : "maven.modrinth:terrablender:KQix25Qc",          // 26.2.0.0.2
	biolith      : "maven.modrinth:biolith:qSLRk6dS",               // 3.7.0-beta.1
	bop          : "maven.modrinth:biomes-o-plenty:MNZPk6V0",       // 26.2.0.0.28
	glitchcore   : "maven.modrinth:glitchcore:SDUCBYRU",            // 26.2.0.0.0, required by Biomes O' Plenty
	terralith    : "maven.modrinth:terralith:OxfI2n80",             // 2.6.4
	lithostitched: "maven.modrinth:lithostitched:sGGUpIGT",         // 1.8.0-fabric-26.2
	tectonic     : "maven.modrinth:tectonic:tGbplDzo",              // 3.0.28-fabric-26.2
	c2me         : "maven.modrinth:c2me-fabric:qwS7dYKj",           // 0.4.2-alpha.0.71+26.2
	lithium      : "maven.modrinth:lithium:f7vZ0VWU",               // mc26.2-0.25.3-fabric
	sodium       : "maven.modrinth:sodium:xJZxADzI",                // mc26.2-0.9.2-fabric
	ferritecore  : "maven.modrinth:ferrite-core:d5ddUdiB",          // 9.0.0-fabric
	chunky       : "maven.modrinth:chunky:86FKD9qx",                // 1.5.66
	dh           : "maven.modrinth:distanthorizons:aAow4a9f",       // 3.3.3-26.2
	// Regions Unexplored has no 26.2 version yet (tested on the 26.1 branch).
]
def compatGroups = [
	apis     : ["terrablender", "biolith"],
	bop      : ["terrablender", "glitchcore", "bop"],
	terralith: ["terralith", "lithostitched"],
	tectonic : ["tectonic", "lithostitched"],
	perf     : ["c2me", "lithium", "sodium", "ferritecore"],
	chunky   : ["chunky"],
	dh       : ["dh"],
]
compatGroups.all = compatMods.keySet() as List

def compat = (findProperty("compat") ?: "").toString().split(",")*.trim().findAll { it }
def compatSelected = compat.collectMany { name ->
	if (!compatGroups.containsKey(name) && !compatMods.containsKey(name)) {
		throw new GradleException("Unknown compat group '${name}'. Use one of: ${compatGroups.keySet() + compatMods.keySet()}")
	}
	compatGroups[name] ?: [name]
}.unique()

dependencies {
	// The tutorial uses the TerraBlender and Biolith APIs (only when those mods are loaded).
	tutorialCompileOnly compatMods.terrablender
	tutorialCompileOnly compatMods.biolith
	compatSelected.each { tutorialRuntimeOnly compatMods[it] }
}

loom.runs.configureEach {
	if (!compat.isEmpty()) {
		vmArg "-Dbiome_tutorial.compat=${compat.join(',')}"
	}
}
